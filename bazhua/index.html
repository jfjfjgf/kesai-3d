<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>KESAi 八爪 HUB · 三维产品展示</title>
<style>
:root{
  --paper:#faf7f1e6;--paper-solid:#faf7f1;--ink:#2a231b;--muted:#6c6052;
  --line:#49372329;--vermilion:#a33a22;--gold:#b0802f;
  --shadow:0 8px 28px #1e160e2e,0 1px 3px #1e160e1f;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --sans:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#dde1e6;color:var(--ink);
  font-family:var(--sans);-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;touch-action:none;-webkit-tap-highlight-color:transparent;cursor:grab;outline:none;
  width:100%;height:100%;display:block}
#gl.dragging{cursor:grabbing}
#gl.hovering{cursor:pointer}
.card{background:var(--paper);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px}

/* ---------- 左上信息卡（对照大雁塔 intro） ---------- */
.intro{left:max(16px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));
  max-width:330px;padding:14px 16px 13px;position:fixed}
.intro h1{font-family:var(--serif);letter-spacing:.1em;margin:0;font-size:24px;font-weight:700;line-height:1.15}
.intro .sub{color:var(--vermilion);margin:4px 0 9px;font-size:13px;font-weight:600;letter-spacing:.04em}
.intro .help{margin:0;padding:0;font-size:13px;line-height:1.7;list-style:none}
.intro .help b{color:var(--vermilion);margin-right:4px;font-weight:600}
.intro .modes{display:flex;flex-direction:column;gap:8px;margin:10px 0 2px}
.mode-btn{align-items:center;background:var(--ink);border:0;border-radius:10px;color:#fff;cursor:pointer;
  display:flex;font-family:inherit;font-size:13.5px;font-weight:600;gap:8px;padding:9px 13px;width:100%}
.mode-btn.alt{background:0 0;border:1px solid var(--line);color:var(--ink)}
.mode-btn:hover{filter:brightness(1.12)}
.mode-btn .dur{color:#ffffffb3;font-weight:400;margin-left:auto;font-size:12px}
.mode-btn.alt .dur{color:var(--muted)}
.mode-btn .ico{font-size:14px}
.intro .note{border-top:1px solid var(--line);color:var(--muted);margin:9px 0 0;padding-top:8px;
  font-size:12px;line-height:1.6}
.intro-head{justify-content:space-between;align-items:center;gap:10px;display:flex}
.intro-toggle{pointer-events:auto;width:32px;min-height:32px;color:var(--muted);background:0 0;
  border-color:#0000;border-radius:8px;flex:none;place-items:center;margin:-4px -6px -4px 0;padding:0;display:grid}
.intro-toggle:hover{color:var(--ink);background:#49372314}
.intro.min .intro-body{display:none}
.intro.min{padding-bottom:14px}

/* ---------- 右上：隐藏界面 + 罗盘 ---------- */
#topRight{right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));
  align-items:center;display:flex;gap:10px;position:fixed}
.tool-btn{pointer-events:auto;color:var(--muted);background:var(--paper);border:1px solid var(--line);
  box-shadow:var(--shadow);border-radius:10px;cursor:pointer;font-family:inherit;font-size:12.5px;padding:7px 11px}
.tool-btn:hover{color:var(--ink)}
.compass{pointer-events:none;border-radius:50%;place-items:center;width:58px;height:58px;display:grid}
.compass svg{width:46px;height:46px;display:block}

/* ---------- 底部工具栏 + 状态行 ---------- */
#hud{align-items:center;bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;
  left:50%;max-width:calc(100vw - 24px);padding:9px 12px;position:fixed;transform:translateX(-50%);
  justify-content:center}
.hud-btn{background:var(--paper-solid);border:1px solid var(--line);border-radius:9px;color:var(--ink);
  cursor:pointer;font-family:inherit;font-size:13px;padding:7px 12px;white-space:nowrap}
.hud-btn:hover{border-color:#49372352}
.hud-btn.on{background:var(--vermilion);border-color:var(--vermilion);color:#fff}
.hud-btn:active{transform:translateY(1px)}
.hud-btn.primary{background:var(--vermilion);border-color:var(--vermilion);color:#fff}
#statusLine{bottom:max(64px,calc(env(safe-area-inset-bottom) + 48px));color:#3d362dcc;font-size:12px;
  left:50%;letter-spacing:.03em;position:fixed;transform:translateX(-50%);text-align:center;
  background:#faf7f180;padding:3px 10px;border-radius:8px;pointer-events:none;white-space:nowrap}

/* ---------- 字幕 / 章节卡 ---------- */
#caption{align-items:center;bottom:max(78px,calc(env(safe-area-inset-bottom) + 62px));display:none;
  left:50%;max-width:min(640px,92vw);padding:10px 18px;position:fixed;transform:translateX(-50%);text-align:center}
#caption.on{display:block}
#caption .chap{color:var(--vermilion);font-size:12px;font-weight:700;letter-spacing:.08em;margin-bottom:3px}
#caption .txt{font-size:14.5px;line-height:1.6}

/* ---------- 场景内标注 ---------- */
.anno{color:var(--ink);background:#faf7f1e0;border:1px solid var(--line);border-radius:999px;
  box-shadow:0 1px 4px #1e160e26;font-size:12px;left:0;padding:3px 10px;position:fixed;top:0;
  transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .18s}
.anno::after{content:"";position:absolute;top:100%;left:50%;width:1px;height:14px;background:#49372359}
.anno b{color:var(--vermilion);font-weight:600}

/* ---------- 部件信息卡（点击选件） ---------- */
#partCard{display:none;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));
  max-width:320px;min-width:210px;padding:12px 16px;position:fixed}
#partCard.on{display:block}
#partCard .tag{color:var(--muted);font-size:11px;letter-spacing:.1em}
#partCard .name{font-size:16px;font-weight:700;margin:2px 26px 4px 0;line-height:1.3}
#partCard .meta{color:var(--muted);font-size:12px;line-height:1.6}
#partCard .close{position:absolute;right:8px;top:8px;border:0;background:0 0;color:var(--muted);
  cursor:pointer;font-size:14px;padding:4px 8px}

/* ---------- 加载 / 错误 ---------- */
#loading{align-items:center;background:#dde1e6;display:grid;inset:0;place-items:center;position:fixed;
  z-index:30;transition:opacity .5s;color:var(--muted);font-size:14px;letter-spacing:.1em}
#loading.gone{opacity:0;pointer-events:none}
#loading .bar{background:#4937231f;border-radius:2px;height:3px;margin:14px auto 0;overflow:hidden;width:180px}
#loading .bar i{background:var(--vermilion);display:block;height:100%;transition:width .3s;width:0}
#err{display:none;inset:0;place-items:center;position:fixed;z-index:40;background:#dde1e6;padding:24px}
#err.on{display:grid}
#err .card{font-size:14px;line-height:1.7;max-width:430px;padding:20px 24px}

/* ---------- 隐藏界面模式 ---------- */
body.hide-ui .intro,body.hide-ui #hud,body.hide-ui #topRight,body.hide-ui #statusLine,
body.hide-ui #caption,body.hide-ui .anno,body.hide-ui #partCard{display:none!important}

/* toast */
#toast{background:var(--ink);color:#fff;border-radius:9px;font-size:12.5px;padding:7px 14px;position:fixed;
  left:50%;top:18px;transform:translateX(-50%);opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
#toast.on{opacity:.92}

@media (max-width:640px){
  .intro{max-width:210px;padding:10px 12px}
  .intro h1{font-size:18px}
  .intro .help{font-size:12px;line-height:1.55}
  .mode-btn{font-size:12.5px;padding:8px 11px}
  .intro .note{font-size:11px}
  #statusLine{display:none}
  #hud{gap:6px;padding:7px 8px}
  .hud-btn{font-size:12px;padding:7px 9px;border-radius:8px}
  #caption{bottom:max(112px,calc(env(safe-area-inset-bottom) + 96px));padding:8px 14px}
  #caption .txt{font-size:13.5px}
  #partCard{max-width:calc(100vw - 40px);min-width:180px}
  .compass{width:46px;height:46px}
  .compass svg{width:36px;height:36px}
  .tool-btn{font-size:11.5px;padding:6px 9px}
}
@media (min-width:641px) and (max-width:1024px){
  .intro{max-width:280px}
  .hud-btn{font-size:12.5px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="loading"><div><div>正在加载三维模型…</div><div class="bar"><i id="bar"></i></div></div></div>
<div id="err"><div class="card" id="errMsg"></div></div>
<div id="toast"></div>

<!-- 左上信息卡 -->
<div class="intro card" id="intro">
  <div class="intro-head">
    <h1>KESAi 八爪</h1>
    <button class="intro-toggle" id="introToggle" title="收起 / 展开">▲</button>
  </div>
  <div class="intro-body">
    <div class="sub">HY-HUB-X01 · OctaLink</div>
    <ul class="help">
      <li><b>拖动</b>鼠标或单指，旋转视角</li>
      <li><b>滚轮 / 双指</b>缩放远近</li>
      <li><b>点击部件</b>查看名称</li>
    </ul>
    <div class="modes">
      <button class="mode-btn" id="btnDemo"><span class="ico">▶</span>讲解演示<span class="dur" id="demoDur">约 1 分半</span></button>
      <button class="mode-btn alt" id="btnTour"><span class="ico">⤴</span>部件巡览<span class="dur">约 3 分钟</span></button>
    </div>
    <p class="note">相机始终环绕产品中心，保持在地面上方，最近距部件 0.3 m。「部件巡览」以第一视角逐件走近讲解，可拖动环球、键面方便。「讲解演示」使用固定录音，章节、镜头与字幕随录音推进；若未放置 narration.mp3 则按内置节奏演示。「拆解产品」动画拆解整机；「标注」开启部件浮标；「高清截图」导出当前画面 PNG。快捷键：空格=环绕，E=拆解，A=标注，H=隐藏界面，R=复位。</p>
  </div>
</div>

<!-- 右上 -->
<div id="topRight">
  <button class="tool-btn" id="btnHideUI">隐藏界面</button>
  <div class="compass card" title="方位">
    <svg viewBox="0 0 48 48" id="compassSvg">
      <circle cx="24" cy="24" r="21" fill="none" stroke="#49372340" stroke-width="1.5"/>
      <g id="compassRose">
        <path d="M24 7 L28 26 L24 22 L20 26 Z" fill="#a33a22"/>
        <path d="M24 41 L28 22 L24 26 L20 22 Z" fill="#6c6052"/>
      </g>
      <text x="24" y="6.5" font-size="8" text-anchor="middle" fill="#2a231b" font-family="inherit">N</text>
    </svg>
  </div>
</div>

<!-- 字幕 -->
<div id="caption" class="card">
  <div class="chap" id="capChap"></div>
  <div class="txt" id="capTxt"></div>
</div>

<!-- 底部工具栏 -->
<div id="hud" class="card">
  <button class="hud-btn primary" id="btnHome">回到初始视角</button>
  <button class="hud-btn" id="btnExplode">拆解产品</button>
  <button class="hud-btn" id="btnDetail">部件细节</button>
  <button class="hud-btn" id="btnAnno">标注</button>
  <button class="hud-btn" id="btnOrbit">环绕</button>
  <button class="hud-btn" id="btnShot">高清截图</button>
</div>
<div id="statusLine"></div>

<!-- 部件信息卡 -->
<div id="partCard" class="card">
  <button class="close" id="pcClose" title="关闭">✕</button>
  <div class="tag">COMPONENT</div>
  <div class="name" id="pcName">—</div>
  <div class="meta" id="pcMeta"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js",
    "three/addons/": "./lib/addons/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ===================== 0. 基础 ===================== */
const $ = (id) => document.getElementById(id);
const canvas = $('gl');
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const DEG = Math.PI/180;

function fail(html){ $('err').classList.add('on'); $('errMsg').innerHTML=html; $('loading').classList.add('gone'); }
if (location.protocol==='file:') {
  fail('<b>请通过本地服务器打开本页。</b><br>双击「打开展示页.bat」，或在目录运行 <code>python -m http.server 8123</code> 后访问 <code>http://127.0.0.1:8123/</code>');
  throw new Error('file protocol');
}

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.98;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdde1e6);
scene.fog = new THREE.Fog(0xdde1e6, 7, 20);

const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 60);
const HOME = { pos:new THREE.Vector3(0.95,0.55,1.72), tgt:new THREE.Vector3(0,0.22,0) };
camera.position.copy(HOME.pos);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.75;

const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(2.2,3.2,1.6);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.radius = 6; key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera,{left:-1.3,right:1.3,top:1.3,bottom:-1.3,near:0.5,far:9});
scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.5);
fill.position.set(-2.4,1.2,-1.8); scene.add(fill);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(3.4,64).rotateX(-Math.PI/2),
  new THREE.ShadowMaterial({opacity:0.28}));
ground.receiveShadow = true; scene.add(ground);
const disc = new THREE.Mesh(
  new THREE.CircleGeometry(1.0,72).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({color:0xc9d0d7,roughness:0.92,metalness:0}));
disc.receiveShadow = true; scene.add(disc);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 0.3; controls.maxDistance = 6;
controls.autoRotate = false; controls.autoRotateSpeed = 0.9;
controls.target.copy(HOME.tgt);

/* ===================== 1. 部件展示名 ===================== */
/* 把 CAD 文件名映射为面向客户的展示名；未映射的用原名。 */
const PART_LABELS = {
  'rj45':'RJ45 网口',
  'M12-S8Y-GPFM16':'M12 传感器接口',
  'SW3DPS-FISCHER HEX M16X1':'M16 电缆接头',
  'P2-9pin(female)-__':'D-Sub 9PIN（母）',
  'P3-15pin(male)-__':'D-Sub 15PIN（公）',
  '________':'信号端子',
  '______6+3.18':'接线端子 3.81mm',
  'emcv_1.5-10-g-3.81':'电源端子排',
  'LED_PCBA_20250311':'LED 指示板',
  'IO200-03-V1':'DIN 导轨卡扣',
  'CMM-KSCR_MECH_CH_06_01_VA':'主壳体（上）',
  'CMM-KSCR_MECH_CV_06_01_VA':'壳体（下）',
  'KCDA01-105':'防护盖',
  'GTS16_MECH_LP_03_01_VA_1+1':'连接板',
};
const displayName = n => PART_LABELS[n] || n;

/* ===================== 2. 模型加载与部件注册 ===================== */
const root = new THREE.Group(); scene.add(root);
const parts = [];      // {mesh,name,dir,home,center,radius}
const matCache = [];
let modelCenter = new THREE.Vector3(0,0.22,0);
let selected = null;

/* KESAi 贴图配色（对照产品宣传图）。注意：GLTFLoader 会清洗节点名
   （点号删除、空格变下划线），因此用正则前缀匹配而不是全名。 */
const PART_COLORS = [
  [/^CMM-KSCR_MECH/, 0xf0ff00],
  [/^IO200/,         0xf0ff00],
  [/^rj45/,          0x3f4247],
  [/^M12/,           0x777b81],
  [/FISCHER/,        0x8a8e94],
  [/^P2-9pin/,       0x55585e],
  [/^P3-15pin/,      0x55585e],
  [/^emcv/,          0x3f4247],
  [/^_+6\+?318/,     0x45484c],
  [/^_+&/,           0xd8dbe0],
  [/^_+$/,           0x4d5054],
  [/^KCDA/,          0xb9bec4],
  [/^LED_PCBA/,      0x2f6e24],
  [/^GTS16/,         0xc9ccd2],
];
function colorFor(name){
  for (const [re, c] of PART_COLORS) if (re.test(name)) return c;
  return 0xf0ff00;
}

/* 品牌标牌与 8 标：官方渲染图裁剪纹理 */
function loadTex(file){
  const tex = new THREE.TextureLoader().load(file);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.center.set(0.5, 0.5);
  tex.rotation = Math.PI;          // 抵消整机 180° 翻转
  return tex;
}
function addFacePlates(model){
  window.__brandPlates = window.__brandPlates || [];
  const mk = (mat, w, h, x, y, z) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    m.userData.brandPlate = true;   // 品牌贴片：不参与配色/爆炸/选件
    m.position.set(x, y, z);           // 贴壳体表面
    m.rotation.y = Math.PI;
    window.__brandPlates.push(m);
    model.add(m);
  };
  /* 品牌标牌 + 8 标：官方素材纹理，位置按产品渲染图测量（仅此两处，模型零改动） */
  mk(new THREE.MeshStandardMaterial({ map: loadTex('brand_plate.png'), roughness: 0.45, metalness: 0.1 }),
     0.46, 0.089, 0.244, -0.229, -0.267);
  mk(new THREE.MeshStandardMaterial({ map: loadTex('eight.png'), roughness: 0.45, metalness: 0.1 }),
     0.044, 0.044, -0.216, -0.226, -0.247);
}

new GLTFLoader().load('octalink.glb?v=6', (gltf)=>{
  const model = gltf.scene;
  model.updateMatrixWorld(true);
  addFacePlates(model);
  root.add(model);

  /* 上下颠倒（安装姿态，与产品宣传图一致）后落地 */
  root.rotation.x = Math.PI;
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const c = box.getCenter(new THREE.Vector3());
  root.position.x -= c.x; root.position.z -= c.z; root.position.y -= box.min.y;
  root.updateMatrixWorld(true);
  modelCenter = new THREE.Vector3(0, c.y - box.min.y, 0);   // 落地后的整机中心

  let idx = 0;
  model.traverse((obj)=>{
    if (!obj.isMesh || obj.userData.brandPlate) return;
    idx++;
    obj.castShadow = obj.receiveShadow = true;
    const mat = obj.material;
    mat.side = THREE.DoubleSide;
    if (mat.color) {
      mat.color.setHex(colorFor(obj.name));
      mat.metalness = 0.12;
      mat.roughness = 0.42;
    }
    mat.envMapIntensity = 0.9;
    matCache.push(mat);
    const bb = new THREE.Box3().setFromObject(obj);
    const pc = bb.getCenter(new THREE.Vector3());
    const radius = bb.getSize(new THREE.Vector3()).length()/2;
    const dir = pc.clone().sub(modelCenter); dir.y *= 0.55;
    if (dir.lengthSq() < 1e-8) dir.set(0,1,0);
    dir.normalize();
    dir.applyEuler(root.rotation);       // 世界方向 -> root 局部（爆炸位移用局部坐标）
    parts.push({ mesh:obj, name:obj.name||`Part ${idx}`, dir, home:obj.position.clone(), center:pc, radius });
  });
  $('loading').classList.add('gone');
  buildAnnotations();
  if (matchMedia('(max-width:640px)').matches && camera.position.lengthSq() > 1e-6){
    camera.position.sub(controls.target).multiplyScalar(0.80).add(controls.target);   // 窄屏拉近视距
  }
  if (matchMedia('(max-width:640px)').matches){
    document.getElementById('intro').classList.add('min');
    document.getElementById('introToggle').textContent = '▼';
  }
  updateStatus();
}, (ev)=>{ if (ev.total) $('bar').style.width = Math.round(ev.loaded/ev.total*100)+'%'; },
(err)=>{ console.error(err); fail('模型加载失败：'+(err&&err.message||'未知错误')+'<br>请确认 octalink.glb 与本页面在同一目录。'); });

const findParts = (re) => parts.filter(p=>re.test(p.name));

/* ===================== 3. 爆炸（拆解） ===================== */
let explodeT = 0;              // 0..1 实际值
let explodeTarget = 0;         // 目标值（每帧向其缓动）
function applyExplode(t){
  const spread = 0.5;
  for (const p of parts) p.mesh.position.copy(p.home).addScaledVector(p.dir, t*spread);
}

/* ===================== 4. 相机 tween ===================== */
let camTween = null;
function tweenCamera(pos, tgt, dur=1400, onDone){
  camTween = {
    t0: performance.now(), dur,
    p0: camera.position.clone(), p1: pos.clone(),
    g0: controls.target.clone(), g1: tgt.clone(),
    onDone, user:null,
  };
  return camTween;
}
function stepTween(now){
  if (!camTween) return;
  const k = clamp((now-camTween.t0)/camTween.dur, 0, 1);
  const e = k<0.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;   // cubic in-out
  camera.position.lerpVectors(camTween.p0, camTween.p1, e);
  controls.target.lerpVectors(camTween.g0, camTween.g1, e);
  if (k>=1){ const cb=camTween.onDone; camTween=null; cb&&cb(); }
}
function stopTween(){ camTween = null; }

/* ===================== 5. 选件 ===================== */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downAt = null;
canvas.addEventListener('pointerdown',(e)=>{ downAt=[e.clientX,e.clientY]; canvas.classList.add('dragging'); stopTour(true); clearTimeout(resumeTimer); controls.autoRotate=false; });
window.addEventListener('pointerup',()=>{ canvas.classList.remove('dragging'); resumeTimer=setTimeout(()=>{ controls.autoRotate=orbitOn; },3000); });
canvas.addEventListener('pointermove',(e)=>{
  if (!parts.length) return;
  ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ndc,camera);
  canvas.classList.toggle('hovering', !!ray.intersectObjects(parts.map(p=>p.mesh),false)[0] && !e.buttons);
});
canvas.addEventListener('click',(e)=>{
  if (!downAt) return;
  const moved = Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1]);
  downAt = null;
  if (moved>5) return;
  ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ndc,camera);
  const hit = ray.intersectObjects(parts.map(p=>p.mesh),false)[0];
  select(hit ? parts.find(p=>p.mesh===hit.object) : null);
});

function select(p){
  if (selected) selected.mesh.material.emissive.setHex(0);
  selected = p;
  const card = $('partCard');
  if (!p){ card.classList.remove('on'); return; }
  p.mesh.material.emissive.setHex(0x0d4d8c);
  p.mesh.material.emissiveIntensity = 0.6;
  $('pcName').textContent = displayName(p.name);
  $('pcMeta').textContent = `部件 ${parts.indexOf(p)+1} / ${parts.length}`;
  card.classList.add('on');
}
$('pcClose').addEventListener('click',()=>select(null));

/* 高亮一组部件（讲解/巡览用） */
function setHighlight(list, on){
  for (const p of list){
    if (p===selected && on) continue;
    p.mesh.material.emissive.setHex(on?0x0d4d8c:0);
    p.mesh.material.emissiveIntensity = 0.45;
  }
}
function clearAllHL(){ for (const m of matCache){ m.emissive.setHex(0); } if (selected){ selected.mesh.material.emissive.setHex(0x0d4d8c); selected.mesh.material.emissiveIntensity=0.6; } }

/* ===================== 6. 讲解演示（固定录音驱动，缺省用内置节奏） ===================== */
/* 章节表：t 为该节开始的秒数。放入 audio/narration.mp3 后，
   请把各节 t 与录音段间停顿对齐（取停顿中点即可）。 */
const CHAPTERS = [
  { t:0,  title:'第 1 节 · 整机概览', text:'HY-HUB-X01「八爪」集线模块，为印刷机电子轴与火眼视觉系统提供统一接线与信号分配。整机宽约 130 毫米，卡装于标准 DIN 导轨。',
    cam:{ pos:[0.95,0.6,1.7], tgt:[0,0.22,0] }, hl:null },
  { t:15.4, title:'第 2 节 · 主壳体', text:'主壳体分前后两半扣合，圍合出内部走线空间，表面作导电处理，兼顾屏蔽与散热。',
    cam:{ pos:[-0.85,0.5,1.5], tgt:[0,0.2,0] }, hl:[/^CMM-KSCR_MECH/] },
  { t:25.5, title:'第 3 节 · DIN 导轨安装', text:'背部红色卡扣直接卡装在 35 毫米标准 DIN 导轨上，徒手即可装拆，维护无需工具。',
    cam:{ pos:[-0.1,0.75,-1.4], tgt:[0,0.35,0.05] }, hl:[/^IO200/] },
  { t:35.7, title:'第 4 节 · 通信接口', text:'正面两路 RJ45 网口负责级联与上级通信；M12 航空接口连接火眼视觉传感器，M16 电缆接头引入主干供电。',
    cam:{ pos:[-0.15,0.35,1.05], tgt:[-0.05,0.22,0.25] }, hl:[/^rj45/,/^M12/,/FISCHER/] },
  { t:49.2, title:'第 5 节 · 扩展接口', text:'D-Sub 9 针与 15 针扩展口对接印刷机电子轴驱动与外部 I/O，屏蔽外壳保证强干扰环境下的信号完整性。',
    cam:{ pos:[0.95,0.4,0.35], tgt:[0.32,0.22,0.05] }, hl:[/^P2-9pin/,/^P3-15pin/] },
  { t:62.1, title:'第 6 节 · 接线端子', text:'机侧全部采用 3.81 毫米间距可插拔端子，六路一组，标识清晰，现场接线快捷且不易错位。',
    cam:{ pos:[-0.8,0.3,0.95], tgt:[-0.15,0.15,0.2] }, hl:[/6\+3\.18/,/^________$/,/^emcv/] },
  { t:73.6, title:'第 7 节 · 状态指示', text:'内置 LED 指示板，电源、通信与故障状态一目了然；配合正面状态灯，巡检时无需开盖。',
    cam:{ pos:[0.5,0.85,0.95], tgt:[0,0.28,0.15] }, hl:[/^LED_PCBA/,/^KCDA/] },
  { t:84.7,title:'第 8 节 · 总结', text:'一个八爪模块，收拢八类接口。装得上、认得清、换得快——让印刷机电子轴与火眼系统的每一根线，都有归处。',
    cam:{ pos:[-1.15,0.7,1.6], tgt:[0,0.22,0] }, hl:null },
];
const DEMO_FALLBACK_TOTAL = 118;   // 无录音时的总时长（秒）

const NARRATION = { audio:null, url:'audio/narration.mp3', loading:null, has:false };
function probeAudio(){
  if (NARRATION.loading) return NARRATION.loading;
  NARRATION.loading = fetch(NARRATION.url, {method:'HEAD'})
    .then(r=>{ NARRATION.has = r.ok && (r.headers.get('content-type')||'').startsWith('audio'); })
    .catch(()=>{ NARRATION.has=false; });
  return NARRATION.loading;
}
probeAudio().then(()=>{ if (NARRATION.has){ $('demoDur').textContent='约 1 分半'; } });

let demo = null;   // {start, audio, chapIdx}
function demoTime(){
  if (demo && demo.audio) return demo.audio.currentTime;
  return demo ? (performance.now()-demo.start)/1000 : 0;
}
function startDemo(){
  stopTour(true); stopDemo(true);
  explodeTarget = 0;
  const begin = ()=>{
    demo = { start:performance.now(), audio:null, chapIdx:-1 };
    $('btnDemo').classList.add('on'); $('btnDemo').firstChild.textContent='⏸';
    // 录音里若含人声，从音频元素取
    if (NARRATION.has){
      const a = new Audio(); a.src = NARRATION.url; a.preload='auto';
      demo.audio = a;
      a.addEventListener('ended', stopDemo);
      a.play().catch(()=>{ demo.audio=null; });
    }
    stepDemo();
  };
  // 拆解态先复位再开始
  if (explodeT>0.01){ explodeTarget=0; }
  tweenCamera(new THREE.Vector3(...CHAPTERS[0].cam.pos), new THREE.Vector3(...CHAPTERS[0].cam.tgt), 1200, begin);
}
function stepDemo(){
  if (!demo) return;
  const t = demoTime();
  let idx = -1;
  for (let i=0;i<CHAPTERS.length;i++) if (t>=CHAPTERS[i].t) idx=i;
  if (idx!==demo.chapIdx){
    demo.chapIdx = idx;
    if (idx>=0){
      const ch = CHAPTERS[idx];
      if (!camTween || camTween.user!=='demo'){
        const tw = tweenCamera(new THREE.Vector3(...ch.cam.pos), new THREE.Vector3(...ch.cam.tgt), 1600);
        tw.user = 'demo';
      }
      showCaption(ch.title, ch.text);
      clearAllHL();
      if (ch.hl) setHighlight(ch.hl.flatMap(re=>findParts(re)), true);
    }
  }
  if (demo && !demo.audio && t>DEMO_FALLBACK_TOTAL) stopDemo();
}
function stopDemo(silent){
  if (!demo) return;
  if (demo.audio){ demo.audio.pause(); }
  demo = null;
  $('btnDemo').classList.remove('on'); $('btnDemo').firstChild.textContent='▶';
  hideCaption(); clearAllHL();
  if (!silent) toast('讲解演示已结束');
}
$('btnDemo').addEventListener('click',()=>{ demo ? stopDemo(true) : startDemo(); });

/* ===================== 7. 部件巡览 ===================== */
const TOUR_SEQ = [
  { re:/^CMM-KSCR_MECH_CH/, text:'主壳体（上）—— 整机骨架，正面开有接口窗，顶部设 DIN 卡扣槽位。' },
  { re:/^IO200/,            text:'DIN 导轨卡扣 —— 红色快拆卡扣，徒手即可将整机固定在 35mm 标准导轨上。' },
  { re:/^rj45/,             text:'RJ45 网口 ×2 —— 上级通信与级联扩展，两路互为备份。' },
  { re:/^M12/,              text:'M12 传感器接口 —— 航空级接插件，连接火眼视觉传感器。' },
  { re:/FISCHER/,           text:'M16 电缆接头 —— 主干供电与总信号引入。' },
  { re:/^P3-15pin/,         text:'D-Sub 15PIN（公）—— 对接印刷机电子轴驱动器。' },
  { re:/^P2-9pin/,          text:'D-Sub 9PIN（母）—— 外部 I/O 与调试接口。' },
  { re:/^emcv/,             text:'电源端子排 —— 3.81mm 间距可插拔设计，供电接线集中管理。' },
  { re:/6\+3\.18/,          text:'接线端子 ×6 —— 信号端子分组排列，标识清晰、防呆防错。' },
  { re:/^LED_PCBA/,         text:'LED 指示板 —— 电源、通信与故障状态指示，巡检免开盖。' },
];
let tour = null;   // {idx, phase:'move'|'stay', until}
function startTour(){
  stopDemo(true); select(null);
  explodeTarget = 0;
  tour = { idx:-1, phase:'move', until:0 };
  $('btnTour').classList.add('on');
  tourNext();
}
function tourNext(){
  if (!tour) return;
  tour.idx++;
  if (tour.idx>=TOUR_SEQ.length){ stopTour(); toast('部件巡览结束'); return; }
  const item = TOUR_SEQ[tour.idx];
  const list = findParts(item.re);
  if (!list.length){ tourNext(); return; }
  const p = list[0];
  const c = p.center.clone();
  const horiz = new THREE.Vector3(c.x-modelCenter.x,0,c.z-modelCenter.z);
  if (horiz.lengthSq()<1e-6) horiz.set(0.5,0,0.5);
  horiz.normalize();
  const dist = Math.max(0.32, p.radius*2.4);
  const pos = c.clone().addScaledVector(horiz,dist).add(new THREE.Vector3(0,0.10+p.radius*0.5,0));
  const name = displayName(p.name);
  const i1 = parts.indexOf(p)+1;
  showCaption(`部件 ${i1}/${parts.length} · 巡览`, `${name} —— ${item.text}`);
  clearAllHL(); setHighlight([p], true);
  tweenCamera(pos, c, 1500, ()=>{ tour.phase='stay'; tour.until=performance.now()+3600; });
}
function stepTour(now){
  if (!tour) return;
  if (tour.phase==='stay' && now>=tour.until) tourNext();
}
function stopTour(silent){
  if (!tour) return;
  tour = null;
  $('btnTour').classList.remove('on');
  hideCaption(); clearAllHL();
  if (!silent) toast('部件巡览已停止');
}
$('btnTour').addEventListener('click',()=>{ tour ? stopTour(true) : startTour(); });

/* ===================== 8. 字幕 / 提示 ===================== */
function showCaption(chap,txt){ $('capChap').textContent=chap; $('capTxt').textContent=txt; $('caption').classList.add('on'); }
function hideCaption(){ $('caption').classList.remove('on'); }
let toastTimer=0;
function toast(s){ const t=$('toast'); t.textContent=s; t.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),2200); }

/* ===================== 9. 标注 ===================== */
const ANNOTATIONS = [
  { re:/^rj45/,        label:'RJ45 网口 ×2', nrm:[0,0.15,1] },
  { re:/^M12/,         label:'M12 传感器接口', nrm:[0.5,0.5,0.7] },
  { re:/FISCHER/,      label:'M16 电缆接头', nrm:[0,1,0.3] },
  { re:/^P2-9pin/,     label:'D-Sub 9PIN', nrm:[-0.3,0.2,0.9] },
  { re:/^P3-15pin/,    label:'D-Sub 15PIN', nrm:[-0.3,0.2,0.9] },
  { re:/6\+3\.18/,     label:'接线端子 ×6', nrm:[0.3,0.4,-0.8] },
  { re:/^IO200/,       label:'DIN 导轨卡扣', nrm:[0,1,0] },
  { re:/^LED_PCBA/,    label:'LED 指示板', nrm:[0,1,0] },
];
const annoEls = [];   // {el, part, nrm, world}
let annoOn = false;
function buildAnnotations(){
  for (const a of ANNOTATIONS){
    const list = findParts(a.re);
    if (!list.length) continue;
    const p = list[0];
    const el = document.createElement('div');
    el.className = 'anno';
    el.innerHTML = a.label;
    document.body.appendChild(el);
    // 锚点：部件外表面一点（中心 + 外法向×半径）
    const n = new THREE.Vector3(...a.nrm).normalize();
    const world = p.center.clone().addScaledVector(n, p.radius*0.55);
    annoEls.push({ el, part:p, world });
  }
}
function stepAnnotations(){
  const v = new THREE.Vector3();
  for (const a of annoEls){
    // 爆炸时标注跟随部件
    v.copy(a.world).add(a.part.mesh.position).sub(a.part.home);
    v.project(camera);
    const on = annoOn && v.z<1 && v.x>-1.05 && v.x<1.05 && v.y>-1.05 && v.y<1.05;
    if (on){
      a.el.style.opacity = 1;
      a.el.style.transform = `translate(-50%,-50%) translate(${(v.x*0.5+0.5)*innerWidth}px,${(-v.y*0.5+0.5)*innerHeight}px)`;
    } else a.el.style.opacity = 0;
  }
}
function setAnno(on){ annoOn=on; $('btnAnno').classList.toggle('on',on); if(!on) annoEls.forEach(a=>a.el.style.opacity=0); }
$('btnAnno').addEventListener('click',()=>setAnno(!annoOn));

/* ===================== 10. 拆解 / 细节 / 环绕 / 复位 / 截图 ===================== */
let detailOn = false;
function setExplode(on){
  explodeTarget = on?1:0;
  $('btnExplode').classList.toggle('on',on);
  $('btnExplode').textContent = on?'收回部件':'拆解产品';
  if (on){ select(null); stopTour(true); stopDemo(true); }
}
$('btnExplode').addEventListener('click',()=>setExplode(explodeTarget<0.5));

const DETAIL_CAM = { pos:new THREE.Vector3(0.2,0.42,1.05), tgt:new THREE.Vector3(0.05,0.2,0.2) };
$('btnDetail').addEventListener('click',(e)=>{
  detailOn = !detailOn;
  e.currentTarget.classList.toggle('on',detailOn);
  if (detailOn){
    stopTour(true); stopDemo(true);
    tweenCamera(DETAIL_CAM.pos, DETAIL_CAM.tgt, 1400);
    toast('部件细节：滚轮拉近查看接口区');
  } else {
    tweenCamera(HOME.pos, HOME.tgt, 1400);
  }
});

let orbitOn = false;
$('btnOrbit').addEventListener('click',(e)=>{
  orbitOn = !orbitOn;
  controls.autoRotate = orbitOn;
  e.currentTarget.classList.toggle('on',orbitOn);
});

function goHome(){
  stopTour(true); stopDemo(true);
  setExplode(false);
  if (detailOn){ detailOn=false; $('btnDetail').classList.remove('on'); }
  select(null); setAnno(false);
  tweenCamera(HOME.pos, HOME.tgt, 1200);
}
$('btnHome').addEventListener('click',goHome);

$('btnShot').addEventListener('click',()=>{
  renderer.render(scene,camera);
  canvas.toBlob((blob)=>{
    if (!blob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'HY-HUB-X01.png';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('已导出当前画面 PNG');
  },'image/png');
});

/* 隐藏界面 */
let uiHidden = false;
function setHideUI(on){
  uiHidden = on;
  document.body.classList.toggle('hide-ui',on);
  $('btnHideUI').textContent = on?'显示界面':'隐藏界面';
  $('btnHideUI').classList.toggle('on',on);
}
$('btnHideUI').addEventListener('click',()=>setHideUI(!uiHidden));

/* 信息卡折叠 */
$('introToggle').addEventListener('click',()=>{
  const min = $('intro').classList.toggle('min');
  $('introToggle').textContent = min?'▼':'▲';
});

/* 快捷键（与大雁塔习惯一致：空格环绕 / H 隐藏 / R 复位 / E 拆解 / A 标注 / Esc 退出） */
addEventListener('keydown',(e)=>{
  if (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  switch(e.code){
    case 'Space': e.preventDefault(); $('btnOrbit').click(); break;
    case 'KeyH': setHideUI(!uiHidden); break;
    case 'KeyR': goHome(); break;
    case 'KeyE': setExplode(explodeTarget<0.5); break;
    case 'KeyA': setAnno(!annoOn); break;
    case 'Escape': stopTour(true); stopDemo(true); select(null); break;
  }
});

/* ===================== 11. 状态行 / 罗盘 ===================== */
function updateStatus(){
  const d = camera.position.distanceTo(controls.target);
  const elev = Math.atan2(camera.position.y-controls.target.y, Math.hypot(camera.position.x-controls.target.x, camera.position.z-controls.target.z))/DEG;
  $('statusLine').textContent = `环绕绕产品中心 · 俯仰 ${elev.toFixed(0)}° · 距离 ${d.toFixed(2)} m（可缩放 ${controls.minDistance.toFixed(1)}–${controls.maxDistance.toFixed(1)} m）`;
  $('compassRose').setAttribute('transform',`rotate(${-controls.getAzimuthalAngle()/DEG} 24 24)`);
}
setInterval(updateStatus, 150);

/* ===================== 12. 主循环 ===================== */
/* 只读调试句柄（控制台/自动化测试用） */
window.__hubDebug = { get state(){
  return {
    demoActive: !!demo,
    chapIdx: demo ? demo.chapIdx : -1,
    audioAttached: !!(demo && demo.audio),
    audioTime: demo && demo.audio ? +demo.audio.currentTime.toFixed(2) : null,
    audioPaused: demo && demo.audio ? demo.audio.paused : null,
    narrationFile: NARRATION.has,
    explodeT: +explodeT.toFixed(3),
    mats: parts.slice(0,30).map(p => p.name + '=' + p.mesh.material.color.getHexString()),
  };
}};

function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

renderer.setAnimationLoop(()=>{
  const now = performance.now();
  stepTween(now);
  if (Math.abs(explodeT-explodeTarget)>0.0005){
    explodeT += (explodeTarget-explodeT)*0.09;     // 缓动逼近
    if (Math.abs(explodeT-explodeTarget)<0.0005) explodeT=explodeTarget;
    applyExplode(explodeT);
  }
  stepDemo();
  stepTour(now);
  stepAnnotations();
  controls.update();
  renderer.render(scene,camera);
});
</script>
</body>
