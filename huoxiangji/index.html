<style>

*{box-sizing:border-box}

.intro{left:max(16px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));max-width:330px;padding:14px 16px 13px;position:fixed}
.intro h1{font-family:var(--serif);letter-spacing:.1em;margin:0;font-size:24px;font-weight:700}
.intro .sub{color:var(--vermilion);margin:4px 0 9px;font-size:13px;font-weight:600}
.intro .help{margin:0;padding:0;font-size:13px;line-height:1.7;list-style:none}
.intro .help b{color:var(--vermilion);margin-right:4px}
.intro .modes{display:flex;flex-direction:column;gap:8px;margin:10px 0 2px}
.mode-btn{align-items:center;background:var(--ink);border:0;border-radius:10px;color:#fff;cursor:pointer;display:flex;font-family:inherit;font-size:13.5px;font-weight:600;gap:8px;padding:9px 13px;width:100%}
.mode-btn.alt{background:0 0;border:1px solid var(--line);color:var(--ink)}
.mode-btn:hover{filter:brightness(1.12)}

.mode-btn.alt .dur{color:var(--muted)}
.intro .note{border-top:1px solid var(--line);color:var(--muted);margin:9px 0 0;padding-top:8px;font-size:12px;line-height:1.6}
.intro-head{justify-content:space-between;align-items:center;gap:10px;display:flex}
.intro-toggle{width:32px;min-height:32px;color:var(--muted);background:0 0;border-color:#0000;border-radius:8px;flex:none;place-items:center;margin:-4px -6px -4px 0;padding:0;display:grid;cursor:pointer}
.intro-toggle:hover{color:var(--ink);background:#49372314}
.intro.min .intro-body{display:none}.intro.min{padding-bottom:14px}
#topRight{right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));align-items:center;display:flex;gap:10px;position:fixed}

.compass{pointer-events:none;border-radius:50%;place-items:center;width:58px;height:58px;display:grid}
.compass svg{width:46px;height:46px}
#hud{align-items:center;bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;left:50%;max-width:calc(100vw - 24px);padding:9px 12px;position:fixed;transform:translateX(-50%)}
.hud-btn{background:var(--paper-solid);border:1px solid var(--line);border-radius:9px;color:var(--ink);cursor:pointer;font-family:inherit;font-size:13px;padding:7px 12px;white-space:nowrap}
.hud-btn:hover{border-color:#49372352}
.hud-btn.on{background:var(--vermilion);border-color:var(--vermilion);color:#fff}
.hud-btn.primary{background:var(--vermilion);border-color:var(--vermilion);color:#fff}
#statusLine{bottom:max(64px,calc(env(safe-area-inset-bottom) + 48px));color:#3d362dcc;font-size:12px;left:50%;position:fixed;transform:translateX(-50%);text-align:center;background:#faf7f180;padding:3px 10px;border-radius:8px;pointer-events:none;white-space:nowrap}
#caption{bottom:max(78px,calc(env(safe-area-inset-bottom) + 62px));display:none;left:50%;max-width:min(640px,92vw);padding:10px 18px;position:fixed;transform:translateX(-50%);text-align:center}
#caption.on{display:block}
#caption .chap{color:var(--vermilion);font-size:12px;font-weight:700;letter-spacing:.08em;margin-bottom:3px}

#partCard.on{display:block}
#partCard .tag{color:var(--muted);font-size:11px;letter-spacing:.1em}
#partCard .name{font-size:16px;font-weight:700;margin:2px 26px 4px 0}

.tool-btn{font-size:11.5px;padding:6px 9px}}

  const RAW=!!cfg.link_raw;   // true: GLB 链节节点姿态=链上姿态(火眼版,免归一,运行时用 th0 增量); false(默认): 节点姿态=零件原始姿态(行走机构版,需 a0 归一+(-π/2)放平)
  const reL=new RegExp(cfg.linkRe);
  const ZD=cfg.zdir||1;   // 拖链方向: 1=固定端在+z(曜光版), -1=固定端在-z(相机版镜像)
  const zF2=ZD<0?-cfg.zF:cfg.zF,B02=ZD<0?-cfg.B0:cfg.B0,home2=ZD<0?-cfg.home:cfg.home;
  const linkParts=[];
  for(const p of parts){
    if(!reL.test(p.name))continue;
    const m=p.mesh;
    m.updateMatrixWorld(true);
    const mrel=new THREE.Matrix4().copy(invRoot).multiply(m.matrixWorld);   // root局部(=模型坐标)
    m.geometry.computeBoundingBox();
    const c=m.geometry.boundingBox.getCenter(new THREE.Vector3()).applyMatrix4(mrel);
    const q=new THREE.Quaternion();
    mrel.decompose(new THREE.Vector3(),q,new THREE.Vector3());
    linkParts.push({m,c,zs:ZD*c.z,a0:new THREE.Euler().setFromQuaternion(q).x});
  }
  // 分类: 下层(y≈y0, zs降序=从固定端起) / 弯头(y过渡, y升序) / 上层(y≈y1, zs升序)
  const TOL=cfg.cls_tol||0.004;   // 下层/上层链节 y 邻近分类容差
  const bot=linkParts.filter(o=>Math.abs(o.c.y-cfg.y0)<TOL).sort((a,b)=>b.zs-a.zs);
  const top=linkParts.filter(o=>Math.abs(o.c.y-cfg.y1)<TOL).sort((a,b)=>a.zs-b.zs);
  const bend=linkParts.filter(o=>!bot.includes(o)&&!top.includes(o)).sort((a,b)=>a.c.y-b.c.y);
  // 复合折线: 固定锚 → 下层链心… → [平滑弯头] → 上层链心… → 移动锚 (全部实测, zs=路径空间)
  const pts=[[zF2,cfg.y0]];
  for(const o of bot)pts.push([o.zs,o.c.y]);
  // 弯头控制点: 两端钉在实测直线末端(与上下平段 y0/y1 无缝衔接, 消除跨界跳变), 中间=接合点+实测弯心
  let ctrl=[];
  if(bend.length){

    const zt=top.length>1?top[1].zs:top[0].zs;

    ctrl.push([zt,cfg.y1]);

  // 弯头平滑化: Catmull-Rom → 按弧长均匀重采样(链节切线连续, 无褶皱)

    const cr=(i,t)=>{

      const P0=(i===0)?{z:P[0].z+0.03,y:P[0].y}:P[i-1];
      const P3=(i===segN-1)?{z:P[segN].z+0.04,y:P[segN].y}:P[Math.min(i+2,segN)];

              0.5*(2*P1.y+(-P0.y+P2.y)*t+(2*P0.y-5*P1.y+4*P2.y-P3.y)*t2+(-P0.y+3*P1.y-3*P2.y+P3.y)*t3)];
    };

    for(let i=0;i<segN;i++)for(let k=0;k<24;k++)raw.push(cr(i,k/24));

  const links=[];
  for(const o of linkParts){

    const bl0=zF2-B02-startOff;

      while(lo<hi-1){const mid=(lo+hi)>>1;if(dCum[mid]<=u)lo=mid;else hi=mid;}
      const kk=(u-dCum[lo])/Math.max(dCum[lo+1]-dCum[lo],1e-9);
      th0=Math.atan2(dPts[lo+1][1]-dPts[lo][1],-(ZD*(dPts[lo+1][0]-dPts[lo][0])));}
    g.applyMatrix4(mrel);g.translate(-o.c.x,-o.c.y,-o.c.z);
    if(!RAW)g.rotateX(-o.a0);   // 旧方案: euler.x 归一到平铺基准(节点姿态=零件原始姿态的产品); RAW 产品节点姿态已是链上姿态, 保留不转
    m.position.set(o.c.x,o.c.y,o.c.z);m.quaternion.identity();m.scale.set(1,1,1);

    links.push(m);
  }
  // 补链节(实例克隆): 让拖链够长以支持全程行走(实物视频: 小车从最左走到最右)
  if(cfg.addLinks>0){
    links.sort((a,b)=>a.userData.wk.s-b.userData.wk.s);
    const ss=links.map(l=>l.userData.wk.s);
    const pitch=(ss[ss.length-1]-ss[0])/(ss.length-1);
    const endGap=Ltot-ss[ss.length-1];              // 末链节到移动锚的原始距离
    const srcBot=links[0];
    let sLast=ss[ss.length-1];
    for(let i=0;i<cfg.addLinks;i++){
      const m2=new THREE.Mesh(srcBot.geometry,srcBot.material);
      m2.castShadow=m2.receiveShadow=true;
      sLast+=pitch;
      m2.userData.wk={s:sLast,x:srcBot.userData.wk.x,th0:Math.PI};   // 补链节在活动端(上层), RAW 模式需 th0
      root.add(m2);
      links.push(m2);
    }
    Ltot=sLast+endGap;
  }
  // 滑车组: 按位置盒选中, 同样私有化几何后整体平移(以模型原始位 home 为基准)
  // rehome: GLB 父节点重复平移导致零件悬空, 归位到设计坐标; adopt: 孤件强制入滑车并移位(如 U型槽管→罩侧)
  const REH=cfg.rehome||{};
  const ADP=cfg.adopt||[];
  const carriage=[];
  for(const p of parts){
    if(reL.test(p.name))continue;
    const m=p.mesh;
    m.updateMatrixWorld(true);
    const mrel=new THREE.Matrix4().copy(invRoot).multiply(m.matrixWorld);
    m.geometry.computeBoundingBox();
    const c=m.geometry.boundingBox.getCenter(new THREE.Vector3()).applyMatrix4(mrel);
    const adp=ADP.find(a=>a.name===p.name);
    const reh=REH[p.name];
    if(adp||reh||c.x>cfg.box[0]&&c.x<cfg.box[1]&&c.y>cfg.box[2]&&c.y<cfg.box[3]&&c.z>cfg.box[4]&&c.z<cfg.box[5]){
      root.attach(m);
      const mrel2=new THREE.Matrix4().copy(invRoot).multiply(m.matrixWorld);
      m.geometry=m.geometry.clone();
      m.geometry.applyMatrix4(mrel2);
      const d=adp?adp.d:(reh||[0,0,0]);
      if(d[0]||d[1]||d[2])m.geometry.translate(d[0],d[1],d[2]);
      m.position.set(0,0,0);m.quaternion.identity();m.scale.set(1,1,1);
      m.userData.wc={z:0};   // 几何已烘焙模型坐标, position.z 只承担行走位移(勿再加 c.z!)
      carriage.push(m);
    }

        new THREE.MeshStandardMaterial({color:0x141414,roughness:0.6,metalness:0.05}));
      m.castShadow=true;
      root.add(m);m.position.set(0,0,0);m.userData.wc={z:0};
      carriage.push(m);
    }
  }

  if(cfg.decals){

      const tex=new THREE.TextureLoader().load(dc.png);
      tex.colorSpace=THREE.SRGBColorSpace;
      const m=new THREE.Mesh(new THREE.PlaneGeometry(dc.w,dc.h),
        new THREE.MeshStandardMaterial({map:tex,transparent:true,roughness:0.55,metalness:0.0,

  walk={on:false,manual:false,ph:ph0,last:0,period:(cfg.period||32),cfg,update,

  window.__walkSet=(mv)=>{walk.manual=true;update(mv);walk.syncPhase(mv);};
  window.__walkDemo=(on)=>{if(walk)walk.twn=null;walk.on=!!on;walk.manual=false;$('btnWalk').classList.toggle('on',walk.on);$('btnWalk').firstChild.textContent=walk.on?'⏸':'▶';};
  window.__walkState=()=>({nLinks:links.length,nCarriage:carriage.length,Ltot:+Ltot.toFixed(4),Lbend:+Lb.toFixed(4),nBot:bot.length,nBend:bend.length,nTop:top.length,on:!!walk.on,ph:+walk.ph.toFixed(3),period:+walk.period.toFixed(1)});
  window.__parts=parts;window.__root=root;   // 调试钩子(审计/验证用)
  try{window.__cam=camera;window.__ctl=controls;window.__ren=renderer;window.__sce=scene;window.__canvas=canvas;window.__tween=tweenCamera;}catch(e){}
  $('btnWalk').style.display='';
  $('btnWalk').addEventListener('click',()=>{
    if(walk)walk.twn=null;   // 行走演示打断套印行走
    walk.on=!walk.on;walk.manual=false;
    $('btnWalk').classList.toggle('on',walk.on);
    $('btnWalk').firstChild.textContent=walk.on?'⏸':'▶';
    if(walk.on){toast('行走演示中:拖链带动滑车往返,可随时旋转缩放');}
    else{toast('行走演示已暂停,再按一次从当前位置继续');}
  });
  if(AUTO_REG){   // 全自动套印: 按下行走至左色标位; 若已在左色标位则行走至右色标位
    const bReg=document.createElement('button');
    bReg.id='btnReg';
    bReg.className='mode-btn';
    bReg.innerHTML='<span class="ico">◆</span>全自动套印<span class="dur">色标</span>';
    bReg.addEventListener('click',()=>{
      if(walk.twn)return;
      if(walk.on){walk.on=false;walk.manual=false;$('btnWalk').classList.remove('on');$('btnWalk').firstChild.textContent='▶';}
      walk.manual=true;
      const target=(curMv<(cfg.mMin+cfg.mMax)/2)?cfg.mMax:cfg.mMin;
      walk.twn={t0:performance.now(),dur:Math.max(900,Math.abs(target-curMv)/Math.abs(cfg.mMax-cfg.mMin)*5200),from:curMv,to:target};
      toast(target===cfg.mMin?'全自动套印: 行走至左侧色标':'全自动套印: 行走至右侧色标');
    });
    $('btnWalk').parentNode.insertBefore(bReg,$('btnWalk').nextSibling);
  }
}

function setHighlight(list,on){for(const p of list){if(p===selected&&on)continue;p.mesh.material.emissive.setHex(on?0x0d4d8c:0);p.mesh.material.emissiveIntensity=0.45;}}
function clearAllHL(){for(const m of matCache){m.emissive.setHex(0);}if(selected){selected.mesh.material.emissive.setHex(0x0d4d8c);selected.mesh.material.emissiveIntensity=0.6;}}
const CHAPTERS=[{"t": 0.0, "title": "第 1 节", "text": "火眼相机行走机构,火眼相机(GVM_CCD)的自动承载行走机构,整机长约 235×256×1460 毫米。", "cam": {"pos": [1.679, 1.241, 2.634], "tgt": [0, 0.128, 0]}, "hl": null, "expl": 0}, {"t": 12.8, "title": "第 2 节", "text": "沿导轨承载火眼相机自动行走,实现相机在检测位置的自动移动与定位。", "cam": {"pos": [0.9, 0.5, 0.95], "tgt": [0.0, 0.128, 0.0]}, "hl": null, "expl": 0, "walk": true}, {"t": 20.66, "title": "第 3 节", "text": "本页支持旋转、缩放,可点击部件查看名称;「讲解演示」播放产品讲解并联动行走演示。", "cam": {"pos": [1.679, 1.241, 2.634], "tgt": [0, 0.128, 0]}, "hl": null, "expl": 0}];
const DEMO_FALLBACK_TOTAL=32;
const NARRATION={audio:null,url:'audio/narration.mp3',loading:null,has:false};
function probeAudio(){NARRATION.has=true;NARRATION.loading=Promise.resolve();return NARRATION.loading;}
probeAudio();
let demo=null;
function demoTime(){if(demo&&demo.audio)return demo.audio.currentTime;return demo?(performance.now()-demo.start)/1000:0;}
function startDemo(){stopTour(true);stopDemo(true);explodeTarget=0;
const begin=()=>{demo={start:performance.now(),audio:null,chapIdx:-1};$('btnDemo').classList.add('on');$('btnDemo').firstChild.textContent='⏸';
if(NARRATION.has){const a=new Audio();a.src=NARRATION.url;a.preload='auto';demo.audio=a;a.addEventListener('ended',stopDemo);a.play().catch(()=>{demo.audio=null;});}stepDemo();};
if(explodeT>0.01){explodeTarget=0;}
tweenCamera(new THREE.Vector3(...CHAPTERS[0].cam.pos),new THREE.Vector3(...CHAPTERS[0].cam.tgt),1200,begin);}
function stepDemo(){if(!demo)return;const t=demoTime();let idx=-1;for(let i=0;i<CHAPTERS.length;i++)if(t>=CHAPTERS[i].t)idx=i;
if(idx!==demo.chapIdx){demo.chapIdx=idx;if(idx>=0){const ch=CHAPTERS[idx];
if(!camTween||camTween.user!=='user'){const tw=tweenCamera(new THREE.Vector3(...ch.cam.pos),new THREE.Vector3(...ch.cam.tgt),1600);tw.user='demo';}
showCaption(ch.title,ch.text);clearAllHL();explodeTarget=ch.expl||0;
if(ch.hl)setHighlight(ch.hl.flatMap(re=>findParts(re)),true);
if(window.__walkDemo)window.__walkDemo(!!ch.walk);}}
if(demo&&!demo.audio&&t>DEMO_FALLBACK_TOTAL)stopDemo();}
function stopDemo(silent){if(!demo)return;if(demo.audio){demo.audio.pause();}demo=null;if(window.__walkDemo)window.__walkDemo(false);$('btnDemo').classList.remove('on');$('btnDemo').firstChild.textContent='▶';hideCaption();clearAllHL();if(!silent)toast('讲解演示已结束');}
window.__demoJump=(t)=>{if(demo){demo.audio=null;demo.start=performance.now()-t*1000;}};
window.__demoStep=()=>{stepDemo();stepTween(performance.now());};
$('btnDemo').addEventListener('click',()=>{demo?stopDemo(true):startDemo();});
const TOUR_SEQ=[{re:new RegExp("扫描_2","i"),text:'整机组成部件之一。'},{re:new RegExp("同步带2M_10x15_L1460","i"),text:'整机组成部件之一。'},{re:new RegExp("NONE_11__2","i"),text:'整机组成部件之一。'},{re:new RegExp("NONE_2_","i"),text:'整机组成部件之一。'},{re:new RegExp("NONE_3_","i"),text:'整机组成部件之一。'},{re:new RegExp("3内","i"),text:'整机组成部件之一。'},{re:new RegExp("2内","i"),text:'整机组成部件之一。'},{re:new RegExp("1内","i"),text:'整机组成部件之一。'},{re:new RegExp("SFP插座1x1_1_solid1","i"),text:'整机组成部件之一。'},{re:new RegExp("SFP插座1x1_4_solid1","i"),text:'整机组成部件之一。'}];
let tour=null;
function startTour(){stopDemo(true);select(null);setExplode(true);tour={idx:-1,phase:'move',until:0};tourNext();}
function tourNext(){if(!tour)return;tour.idx++;if(tour.idx>=TOUR_SEQ.length){stopTour();toast('部件巡览结束');return;}
const item=TOUR_SEQ[tour.idx];const list=findParts(item.re);if(!list.length){tourNext();return;}
const p=list[0];const c=p.center.clone();
const horiz=new THREE.Vector3(c.x-modelCenter.x,0,c.z-modelCenter.z);if(horiz.lengthSq()<1e-6)horiz.set(0.5,0,0.5);horiz.normalize();
const dist=Math.max(0.511,p.radius*2.4);
const pos=c.clone().addScaledVector(horiz,dist).add(new THREE.Vector3(0,0.10+p.radius*0.5,0));
showCaption('部件 '+(parts.indexOf(p)+1)+'/'+parts.length+' · 巡览',displayName(p.name)+' —— '+item.text);
clearAllHL();setHighlight([p],true);
tweenCamera(pos,c,1500,()=>{tour.phase='stay';tour.until=performance.now()+3600;});}
function stepTour(now){if(!tour)return;if(tour.phase==='stay'&&now>=tour.until)tourNext();}
function stopTour(silent){if(!tour)return;tour=null;hideCaption();clearAllHL();if(!silent)toast('部件巡览已停止');}
function showCaption(c,t){$('capChap').textContent=c;$('capTxt').textContent=t;$('caption').classList.add('on');}
function hideCaption(){$('caption').classList.remove('on');}
let toastTimer=0;
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),2200);}
function setExplode(on){explodeTarget=on?1:0;$('btnExplode').classList.toggle('on',on);$('btnExplode').textContent=on?'收回部件':'拆解产品';if(on){select(null);stopTour(true);stopDemo(true);}}
$('btnExplode').addEventListener('click',()=>setExplode(explodeTarget<0.5));
let uiHidden=false;
function setHideUI(on){uiHidden=on;document.body.classList.toggle('hide-ui',on);$('btnHideUI').textContent=on?'显示界面':'隐藏界面';}
$('btnHideUI').addEventListener('click',()=>setHideUI(!uiHidden));
$('introToggle').addEventListener('click',()=>{const m=$('intro').classList.toggle('min');$('introToggle').textContent=m?'▼':'▲';});
addEventListener('keydown',(e)=>{switch(e.code){case 'Space':e.preventDefault();$('btnOrbit').click();break;
case 'KeyH':setHideUI(!uiHidden);break;case 'KeyE':if(!SINGLE&&!NOEXPLODE)setExplode(explodeTarget<0.5);break;
case 'Escape':stopTour(true);stopDemo(true);select(null);break;}});
function goHome(){stopTour(true);stopDemo(true);setExplode(false);select(null);tweenCamera(HOME.pos,HOME.tgt,1200);}
$('btnHome').addEventListener('click',goHome);
$('btnOrbit').addEventListener('click',(e)=>{orbitOn=!orbitOn;controls.autoRotate=orbitOn;e.currentTarget.classList.toggle('on',orbitOn);});
$('btnShot').addEventListener('click',()=>{renderer.render(scene,camera);canvas.toBlob((blob)=>{if(!blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='huoxiangji.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('已导出当前画面 PNG');},'image/png');});
function updateStatus(){const d=camera.position.distanceTo(controls.target);
const elev=Math.atan2(camera.position.y-controls.target.y,Math.hypot(camera.position.x-controls.target.x,camera.position.z-controls.target.z))/DEG;
$('statusLine').textContent='环绕产品中心 · 俯仰 '+elev.toFixed(0)+'° · 距离 '+d.toFixed(2)+' m';
$('compassRose').setAttribute('transform','rotate('+(-controls.getAzimuthalAngle()/DEG)+' 24 24)');}
setInterval(updateStatus,150);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
window.__dbg={camera,controls,renderer,scene,root,parts};   // CDP 调试钩子
renderer.setAnimationLoop(()=>{const now=performance.now();stepTween(now);stepWalk(now);
if(Math.abs(explodeT-explodeTarget)>0.0005){explodeT+=(explodeTarget-explodeT)*0.09;if(Math.abs(explodeT-explodeTarget)<0.0005)explodeT=explodeTarget;applyExplode(explodeT);}
stepDemo();stepTour(now);controls.update();renderer.render(scene,camera);});
</script>
</body>
</html>
